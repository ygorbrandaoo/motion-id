[project]
name = "motion-id"
version = "0.1.0"
description = "Human activity recognition from smartphone motion sensors"
requires-python = ">=3.12"
dependencies = [
    "matplotlib",
    "numpy",
    "pyyaml",
    "scikit-learn==1.9.1",
]

[dependency-groups]
dev = ["pytest"]
notebook = ["ipykernel", "nbconvert", "nbformat", "pandas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
